[project]
name = "graphs"
version = "0.1.0"
description = "Simple undirected graph library with representation conversions, random generators, and Tkinter visualization."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graphs"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.10"
